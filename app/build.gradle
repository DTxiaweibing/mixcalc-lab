apply plugin: 'com.android.application'

// 签名配置从仓库外的 keystore.properties 读取；文件不存在时 release 构建保持未签名，
// 这样别人拉代码也能正常 assembleDebug，不会因为缺密钥而失败。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { stream ->
        // 路径可能含中文，按 UTF-8 读取，避免 Properties 默认 ISO-8859-1 乱码
        keystoreProps.load(new InputStreamReader(stream, 'UTF-8'))
    }
}
def hasSigningConfig = keystorePropsFile.exists() && keystoreProps['storeFile']

android {
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.shrimpfarm.app.calclab"
        namespace "com.shrimpfarm.app"
        minSdkVersion 28
        targetSdkVersion 36
        versionCode 10
        versionName "0.3.7"
        multiDexEnabled true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
                // 三种签名方案全开：老设备认 V1(JAR)，Android 7+ 认 V2，Android 9+ 认 V3
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        debug {
            // 调试包也用发布密钥签名：调试包和 release 包可以互相覆盖安装、共用同一份数据，
            // 不会再出现「签名不一致，请先卸载」。没有 keystore.properties 的机器自动回退默认调试签名。
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
        release {
            minifyEnabled false
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
}