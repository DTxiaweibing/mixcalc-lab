apply plugin: 'com.android.application'

// 签名配置从仓库外的 keystore.properties 读取；文件不存在时 release 构建保持未签名，
// 这样别人拉代码也能正常 assembleDebug，不会因为缺密钥而失败。
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { stream ->
        // 路径可能含中文，按 UTF-8 读取，避免 Properties 默认 ISO-8859-1 乱码
        keystoreProps.load(new InputStreamReader(stream, 'UTF-8'))
    }
}
def hasSigningConfig = keystorePropsFile.exists() && keystoreProps['storeFile']

android {
    compileSdkVersion 36

    defaultConfig {
        applicationId "com.shrimpfarm.app.calclab"
        namespace "com.shrimpfarm.app"
        minSdkVersion 28
        targetSdkVersion 36
        versionCode 7
        versionName "0.3.4"
        multiDexEnabled true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            if (hasSigningConfig) {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (hasSigningConfig) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.18.0'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
}